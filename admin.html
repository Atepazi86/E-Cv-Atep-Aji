<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kelola Portofolio</title>
<style>
:root{--bg:#f4f5fb;--bg2:#fff;--fg:#14152e;--mut:#5b5e82;--line:#dcdef2;--a1:#6d4aff;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0a0b1e;--bg2:#10122c;--fg:#eef0ff;--mut:#9a9dc6;--line:#23264d;--a1:#8b6cff;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--a1)}
.btn.pri{background:var(--a1);color:#fff;border-color:var(--a1)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:84px;resize:vertical}
label,.fld{display:grid;gap:5px;font-size:13px;color:var(--mut)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:14px}
.box h1{font-size:22px}.box p{color:var(--mut);font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.top{position:sticky;top:0;z-index:10;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{font-size:16px;margin-right:auto}
.dirty{font-size:12px;color:var(--mut)}
.dirty.on{color:#d97706;font-weight:600}
.layout{max-width:900px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.tab.on{background:var(--a1);color:#fff;border-color:var(--a1)}
.panel{display:grid;gap:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>summary{padding:12px 14px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"▸";color:var(--mut)}
.card[open]>summary::before{content:"▾"}
.card>summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:4px 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.flat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.img{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img .pv{width:96px;height:72px;border-radius:10px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:12px;overflow:hidden}
.img .pv img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
#toast.bad{background:#b91c1c}
</style>
</head>
<body>

<div id="login">
  <form class="box" id="lf">
    <h1>Kelola Portofolio</h1>
    <p>Masuk untuk mengubah isi situs.</p>
    <label>Email<input type="email" id="le" autocomplete="username" required></label>
    <label>Password<input type="password" id="lp" autocomplete="current-password" required></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn pri" type="submit" id="lb">Masuk</button>
    <a href="index.html" class="hint" style="text-align:center">← Kembali ke situs</a>
  </form>
</div>

<div id="app" class="hide">
  <div class="top">
    <b>Kelola konten</b>
    <span class="dirty" id="dirty">Tersimpan</span>
    <a class="btn" href="index.html" target="_blank" rel="noopener">Lihat situs</a>
    <button class="btn pri" id="save">Simpan &amp; terbitkan</button>
    <button class="btn" id="out">Keluar</button>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div id="panel" class="panel"></div>
    <div style="margin-top:28px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" id="pw">Ganti password</button>
      <button class="btn sm bad" id="rst">Pulihkan data awal</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="content.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function toast(m,bad){var t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=""},3200)}

var db=window.getDB&&window.getDB();
if(!db){$("#lf").innerHTML='<h1>Belum dikonfigurasi</h1><p>Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> di file <b>config.js</b>, lalu muat ulang halaman ini. Langkahnya ada di PANDUAN.md.</p>';return}

// ---------- skema form ----------
var CATS=["Web","Jaringan","Kreatif","Organisasi"];
var PROFILE=[
 ["Beranda",null],
 ["name","Nama lengkap","text"],["role","Peran / jabatan","text"],["tag","Label kecil di atas nama","text"],["status","Teks status ketersediaan","text"],
 ["lead","Kalimat pembuka","textarea"],["badges","Lencana beranda (satu per baris, format: PHP | Laravel)","lines"],
 ["photo","Foto profil (dipakai di beranda dan bagian Tentang)","image"],["cardName","Nama di kartu","text"],["cardSub","Keterangan di kartu","text"],
 ["Tentang saya",null],
 ["about","Isi (pisahkan paragraf dengan satu baris kosong)","paras"],
 ["Angka ringkas",null],
 ["ipk","IPK","text"],["years","Tahun belajar","text"],["leader","Jumlah peran ketua","text"],["areas","Jumlah bidang fokus","text"],["focus","Fokus (Quick view)","text"],["ready","Siap untuk (Quick view)","text"],
 ["Kontak & footer",null],
 ["email","Email","text"],["wa","Nomor WhatsApp (format 62812…, tanpa +)","text"],["instagram","Username Instagram (tanpa @)","text"],["location","Lokasi","text"],["footer","Deskripsi footer","textarea"]
];
var LISTS={
 skills:{add:"Tambah keahlian",title:function(x){return x.n+" ("+x.v+"%)"},blank:{n:"",v:50},f:[["n","Nama keahlian","text"],["v","Level (0–100)","number"]]},
 techs:{add:"Tambah kelompok",title:function(x){return x.g},blank:{g:"",items:[]},f:[["g","Nama kelompok (mis. Frontend)","text"],["items","Daftar teknologi (pisahkan dengan koma)","csv"]]},
 projects:{add:"Tambah proyek",title:function(x){return x.t},blank:{c:"Web",t:"Proyek baru",d:"",s:[],e:"💻",img:"",demo:"",gh:""},
  f:[["t","Judul","text"],["c","Kategori","select"],["d","Deskripsi","textarea"],["s","Teknologi (pisahkan dengan koma)","csv"],["img","Gambar sampul","image"],["e","Emoji sampul (dipakai bila tanpa gambar)","text"],["demo","Link Live Demo (https://…)","text"],["gh","Link GitHub (https://…)","text"]]},
 experience:{add:"Tambah pengalaman",title:function(x){return x.title},blank:{time:"",title:"Pengalaman baru",sub:"",points:[],result:""},
  f:[["time","Tahun / periode","text"],["title","Judul peran","text"],["sub","Organisasi / tempat","text"],["points","Poin kegiatan (satu per baris)","lines"],["result","Label hasil (opsional)","text"]]},
 education:{add:"Tambah pendidikan",title:function(x){return x.title},blank:{time:"",title:"Pendidikan baru",sub:"",points:[],result:""},
  f:[["time","Tahun / periode","text"],["title","Nama sekolah / kampus","text"],["sub","Jurusan / keterangan","text"],["points","Poin (satu per baris)","lines"],["result","Label (mis. IPK)","text"]]},
 certificates:{add:"Tambah sertifikat",title:function(x){return x.t},blank:{t:"Sertifikat baru",i:"Penerbit, tahun",e:"🏅",img:""},
  f:[["t","Nama sertifikat","text"],["i","Penerbit dan tahun","text"],["img","Gambar sertifikat","image"],["e","Emoji sampul (dipakai bila tanpa gambar)","text"]]}
};
var TABS=[["profile","Profil & Tentang"],["skills","Keahlian"],["techs","Teknologi"],["projects","Proyek"],["experience","Pengalaman"],["education","Pendidikan"],["certificates","Sertifikat"]];

// ---------- state ----------
var data=null,tab="profile",dirty=false,opened={};
function setDirty(v){dirty=v;var d=$("#dirty");d.textContent=v?"Belum disimpan":"Tersimpan";d.className="dirty"+(v?" on":"")}
addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});

// ---------- bentuk input ----------
function toStr(type,v){
 if(type==="lines")return (v||[]).join("\n");
 if(type==="paras")return (v||[]).join("\n\n");
 if(type==="csv")return (v||[]).join(", ");
 return v==null?"":v}
function fromStr(type,s){
 if(type==="lines")return s.split("\n");
 if(type==="paras")return s.split(/\n\s*\n/);
 if(type==="csv")return s.split(",");
 if(type==="number")return s===""?0:Number(s);
 return s}
function field(sec,i,f,obj){
 var k=f[0],lab=f[1],type=f[2],v=obj[k],at=' data-s="'+sec+'" data-i="'+i+'" data-k="'+k+'" data-t="'+type+'"';
 if(type==="image"){
  var u=v||"";
  return '<div class="fld">'+esc(lab)+'<span class="img"><span class="pv">'+(u?'<img src="'+esc(u)+'" alt="" onerror="this.remove()">':'Kosong')+'</span><span class="acts"><label class="btn sm" style="display:inline-block;cursor:pointer">Pilih gambar…<input type="file" accept="image/*" hidden'+at+' data-up="1"></label>'+(u?'<button class="btn sm bad" type="button" data-act="clr"'+at+'>Hapus</button>':'')+'</span></span></div>'}
 if(type==="textarea"||type==="lines"||type==="paras")return '<label>'+esc(lab)+'<textarea'+at+' rows="'+(type==="paras"?7:3)+'">'+esc(toStr(type,v))+'</textarea></label>';
 if(type==="select")return '<label>'+esc(lab)+'<select'+at+'>'+CATS.map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join("")+'</select></label>';
 return '<label>'+esc(lab)+'<input'+(type==="number"?' type="number" min="0" max="100"':'')+at+' value="'+esc(toStr(type,v))+'"></label>'}

// ---------- tampilan ----------
function draw(){
 $("#tabs").innerHTML=TABS.map(function(t){return '<button class="tab'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("");
 var h="";
 if(tab==="profile"){
  var grp="",open=false;
  PROFILE.forEach(function(f){
   if(f[1]===null){if(open)h+='</div>';h+='<div class="flat"><b>'+esc(f[0])+'</b>';open=true}
   else h+=field("profile","",f,data.profile)});
  if(open)h+='</div>';
 }else{
  var L=LISTS[tab],arr=data[tab];
  h=arr.map(function(x,i){
   var key=tab+":"+i;
   return '<details class="card" data-key="'+key+'"'+(opened[key]?' open':'')+'><summary><span>'+esc(L.title(x)||"(tanpa judul)")+'</span></summary><div class="body">'+L.f.map(function(f){return field(tab,i,f,x)}).join("")+
   '<div class="acts"><button class="btn sm" data-act="up" data-s="'+tab+'" data-i="'+i+'">▲ Naik</button><button class="btn sm" data-act="down" data-s="'+tab+'" data-i="'+i+'">▼ Turun</button><button class="btn sm bad" data-act="del" data-s="'+tab+'" data-i="'+i+'">Hapus</button></div></div></details>'}).join("");
  h+='<button class="btn pri" data-act="add" data-s="'+tab+'">+ '+L.add+'</button>';
  if(!arr.length)h='<p class="hint">Belum ada item. Bagian ini akan disembunyikan dari situs bila kosong.</p>'+h;
 }
 $("#panel").innerHTML=h}

function target(e){var s=e.dataset.s,i=e.dataset.i;return s==="profile"?data.profile:data[s][+i]}

// ---------- event ----------
$("#tabs").onclick=function(e){var b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;draw()}};
$("#panel").addEventListener("input",function(e){
 var el=e.target;if(!el.dataset.k||el.dataset.up)return;
 target(el)[el.dataset.k]=fromStr(el.dataset.t,el.value);setDirty(true);
 if(el.dataset.s!=="profile"){var L=LISTS[el.dataset.s],c=el.closest(".card");if(c){var x=data[el.dataset.s][+el.dataset.i];c.querySelector("summary span").textContent=L.title(x)||"(tanpa judul)"}}});
$("#panel").addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.key)opened[d.dataset.key]=d.open},true);
$("#panel").addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,s=b.dataset.s,i=+b.dataset.i;
 if(a==="add"){data[s].push(JSON.parse(JSON.stringify(LISTS[s].blank)));opened[s+":"+(data[s].length-1)]=true}
 else if(a==="del"){if(!confirm("Hapus item ini?"))return;data[s].splice(i,1);opened={}}
 else if(a==="up"&&i>0){var t=data[s][i];data[s][i]=data[s][i-1];data[s][i-1]=t;opened={};opened[s+":"+(i-1)]=true}
 else if(a==="down"&&i<data[s].length-1){var t2=data[s][i];data[s][i]=data[s][i+1];data[s][i+1]=t2;opened={};opened[s+":"+(i+1)]=true}
 else if(a==="clr"){target(b)[b.dataset.k]=""}
 else return;
 setDirty(true);draw()});
$("#panel").addEventListener("change",function(e){
 var el=e.target;if(!el.dataset.up||!el.files[0])return;
 var f=el.files[0],obj=target(el),k=el.dataset.k;
 if(f.size>15*1024*1024){toast("Gambar terlalu besar (maks 15 MB).",1);return}
 toast("Mengunggah gambar…");
 prep(f,k==="photo").then(function(r){
  var path="uploads/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+"."+r.ext;
  return db.storage.from("media").upload(path,r.blob,{contentType:r.type,cacheControl:"31536000"}).then(function(res){
   if(res.error)throw res.error;
   obj[k]=db.storage.from("media").getPublicUrl(path).data.publicUrl;setDirty(true);draw();toast("Gambar terunggah. Jangan lupa Simpan & terbitkan.")})
 }).catch(function(err){toast("Gagal unggah: "+(err&&err.message||err),1)})});

// perkecil gambar sebelum diunggah (PNG dipertahankan untuk foto profil agar tetap transparan)
function prep(file,keepPng){
 return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;
  r.onload=function(){var im=new Image();im.onerror=function(){rej(new Error("File bukan gambar yang valid"))};
   im.onload=function(){var k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var png=keepPng&&file.type==="image/png",type=png?"image/png":"image/jpeg",x=c.getContext("2d");
    if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){b?res({blob:b,type:type,ext:png?"png":"jpg"}):rej(new Error("Gagal memproses gambar"))},type,.85)};
   im.src=r.result};
  r.readAsDataURL(file)})}

// ---------- simpan ----------
function clean(v){
 if(Array.isArray(v)){if(v.length&&typeof v[0]==="string")return v.map(function(s){return s.trim()}).filter(Boolean);return v.map(clean)}
 if(v&&typeof v==="object"){var o={};Object.keys(v).forEach(function(k){o[k]=clean(v[k])});return o}
 return typeof v==="string"?v.trim():v}
$("#save").onclick=function(){
 var b=this;b.disabled=true;b.textContent="Menyimpan…";
 var out=clean(data);
 db.from("site_content").upsert({id:1,data:out,updated_at:new Date().toISOString()}).then(function(r){
  if(r.error)throw r.error;data=window.mergeContent(out);setDirty(false);draw();
  try{localStorage.setItem("pf-cache",JSON.stringify(out))}catch(e){}
  toast("Tersimpan. Situs publik sudah diperbarui.")
 }).catch(function(err){toast("Gagal menyimpan: "+(err&&err.message||err),1)}).then(function(){b.disabled=false;b.textContent="Simpan & terbitkan"})};
$("#rst").onclick=function(){if(confirm("Kembalikan semua isi ke data awal? Belum tersimpan sampai Anda menekan Simpan & terbitkan.")){data=window.mergeContent(null);opened={};setDirty(true);draw()}};
$("#pw").onclick=function(){var p=prompt("Password baru (minimal 8 karakter):");if(!p)return;if(p.length<8){toast("Password terlalu pendek.",1);return}
 db.auth.updateUser({password:p}).then(function(r){r.error?toast("Gagal: "+r.error.message,1):toast("Password diganti.")})};
$("#out").onclick=function(){if(dirty&&!confirm("Ada perubahan yang belum disimpan. Tetap keluar?"))return;db.auth.signOut().then(function(){location.reload()})};

// ---------- login ----------
function start(){
 $("#login").classList.add("hide");$("#app").classList.remove("hide");
 db.from("site_content").select("data").eq("id",1).maybeSingle().then(function(r){
  if(r.error)toast("Gagal memuat data: "+r.error.message,1);
  data=window.mergeContent(r.data&&r.data.data);setDirty(false);draw()})}
$("#lf").onsubmit=function(e){e.preventDefault();var b=$("#lb");b.disabled=true;$("#lerr").textContent="";
 db.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value}).then(function(r){
  b.disabled=false;if(r.error){$("#lerr").textContent="Email atau password salah.";return}start()})};
db.auth.getSession().then(function(r){if(r.data&&r.data.session)start()});
})();
</script>
</body>
</html>
